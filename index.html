// ============ ROUTER ============
function navigate(page, id) {
  State.currentPage = page;
  State.selectedProduct = id || null;
  State.mobileMenuOpen = false;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

// ============ HELPERS ============
function showNotification(msg, type='default') {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.className = 'notification show ' + type;
  setTimeout(() => el.className = 'notification', 2500);
}

function addToCart(productId, size, color, qty=1) {
  const p = products.find(x=>x.id===productId);
  const s = size || p.sizes[0];
  const c = color || p.colors[0];
  const existing = State.cart.find(i=>i.id===productId && i.size===s && i.color===c);
  if(existing) { existing.qty += qty; }
  else { State.cart.push({id:productId,size:s,color:c,qty}); }
  render();
  showNotification('Added to bag!', 'success');
}

function removeFromCart(index) {
  State.cart.splice(index, 1);
  render();
}

function toggleWishlist(productId) {
  const idx = State.wishlist.indexOf(productId);
  if(idx > -1) { State.wishlist.splice(idx, 1); showNotification('Removed from wishlist'); }
  else { State.wishlist.push(productId); showNotification('Added to wishlist!', 'success'); }
  render();
}

function getCartCount() { return State.cart.reduce((a,i)=>a+i.qty,0); }
function getCartTotal() { return State.cart.reduce((a,i)=>{const p=products.find(x=>x.id===i.id);return a+(p.salePrice||p.price)*i.qty;},0); }
function getStars(rating) {
  let s='';
  for(let i=1;i<=5;i++) s += i<=Math.floor(rating)?'<i class="fas fa-star"></i>':(i-0.5<=rating?'<i class="fas fa-star-half-alt"></i>':'<i class="far fa-star"></i>');
  return s;
}

function getFilteredProducts() {
  let filtered = [...products];
  if(State.searchQuery) {
    const q = State.searchQuery.toLowerCase();
    filtered = filtered.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.gender.toLowerCase().includes(q)||p.description.toLowerCase().includes(q));
  }
  const f = State.filters;
  if(f.gender!=='all') filtered = filtered.filter(p=>p.gender===f.gender||p.gender==='unisex');
  if(f.size!=='all') filtered = filtered.filter(p=>p.sizes.includes(f.size));
  if(f.color!=='all') filtered = filtered.filter(p=>p.colors.some(c=>c.toLowerCase()===f.color));
  if(f.priceRange!=='all') {
    const [min,max] = f.priceRange.split('-').map(Number);
    filtered = filtered.filter(p=>{const pr=p.salePrice||p.price; return pr>=min&&(max?pr<=max:true)});
  }
  if(f.rating!=='all') filtered = filtered.filter(p=>p.rating>=Number(f.rating));
  if(f.sort==='price-low') filtered.sort((a,b)=>(a.salePrice||a.price)-(b.salePrice||b.price));
  else if(f.sort==='price-high') filtered.sort((a,b)=>(b.salePrice||b.price)-(a.salePrice||a.price));
  else if(f.sort==='rating') filtered.sort((a,b)=>b.rating-a.rating);
  else if(f.sort==='newest') filtered.sort((a,b)=>b.id-a.id);
  return filtered;
}

function render() {
  const app = document.getElementById('app');
  switch(State.currentPage) {
    case 'home': app.innerHTML = HomePage(); break;

    case 'product': app.innerHTML = ProductPage(); break;
    case 'cart': app.innerHTML = CartPage(); break;
    case 'checkout': app.innerHTML = CheckoutPage(); break;
    case 'wishlist': app.innerHTML = WishlistPage(); break;
    case 'account': app.innerHTML = AccountPage(); break;
    case 'search': app.innerHTML = SearchPage(); break;
    case 'sale': app.innerHTML = SalePage(); break;
    case 'about': app.innerHTML = AboutPage(); break;
    case 'contact': app.innerHTML = ContactPage(); break;
    case 'admin': app.innerHTML = AdminPage(); break;
    default: app.innerHTML = HomePage();
  }
}
